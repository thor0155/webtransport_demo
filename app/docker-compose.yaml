services:

  backend_migrate:
    image: demo-backend-migrate:${BACKEND_MIGRATE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
      args:
        ENV_NAME: ${BACKEND_MIGRATE_ENV_NAME:-production}
        BUILD_VERSION: ${BACKEND_MIGRATE_BUILD_VERSION:-v0.0.0}
        BUILD_DATE: ${BACKEND_MIGRATE_BUILD_DATE:-unknown}
        BUILD_COMMIT: ${BACKEND_MIGRATE_BUILD_COMMIT:-unknown}
        BUILD_BRANCH: ${BACKEND_MIGRATE_BUILD_BRANCH:-unknown}
    environment:
      - LOG_LEVEL=debug
    networks:
      - mylab
    command: ["migrate"]
    restart: "no"

  backend_server:
    image: demo-backend-server:${BACKEND_SERVER_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.server
      args:
        ENV_NAME: ${BACKEND_SERVER_ENV_NAME:-production}
        BUILD_VERSION: ${BACKEND_SERVER_BUILD_VERSION:-v0.0.0}
        BUILD_DATE: ${BACKEND_SERVER_BUILD_DATE:-unknown}
        BUILD_COMMIT: ${BACKEND_SERVER_BUILD_COMMIT:-unknown}
        BUILD_BRANCH: ${BACKEND_SERVER_BUILD_BRANCH:-unknown}
    ports:
      - "8080:8080"
      - "8443:8443/udp"
    environment:
      - WEBTRANSPORT_SERVER_USE_SELF_CERT=true
      - GIN_MODE=test
      - LOG_LEVEL=debug
      - HTTP_CORS_ENABLED=true
      - DB_MONGODB_USERNAME=root
      - DB_MONGODB_PASSWORD=root
    networks:
      - mylab

  frontend:
    image: demo-frontend:${TAG:-latest}
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend_server
    environment:
      - WEBTRANSPORT_ENDPOINT=https://localhost:8443/webtransport
      - WEBTRANSPORT_USE_CERT_HASH=true
      - API_BASE_URL=http://localhost:8080
    networks:
      - mylab

networks:
  mylab:
    name: mylab
    external: true