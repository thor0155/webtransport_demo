components:
  db:
    mysql:
      active: ${DB_MYSQL_ACTIVE:true} 
      host: ${DB_MYSQL_HOST:mysql} 
      port: ${DB_MYSQL_PORT:3306}  
      user: ${DB_MYSQL_USER:root}
      password: ${DB_MYSQL_PASSWORD:} 
      dbname: ${DB_MYSQL_DBNAME:demo} 
      # 常用連線參數 
      charset: "utf8mb4" # 建議使用 utf8mb4，支援 emoji 
      parseTime: ${DB_MYSQL_PARSE_TIME:true} # 自動解析 DATETIME/TIMESTAMP 為 time.Time 
      loc: ${DB_MYSQL_LOC:} # 指定時區，避免時間錯誤 
      # 連線池設定 (最佳實務) 
      maxOpenConns: ${DB_MYSQL_MAX_OPEN_CONNS:16} # 最大開啟連線數 
      maxIdleConns: ${DB_MYSQL_MAX_IDLE_CONNS:4} # 最大空閒連線數 
      connMaxLifetime: ${DB_MYSQL_CONN_MAX_LIFETIME:300s} # 單一連線最長存活時間 (秒) 
      connMaxIdleTime: ${DB_MYSQL_CONN_MAX_IDLE_TIME:60s} # 空閒連線最長存活時間 (秒) 
      # 超時設定 
      timeout: ${DB_MYSQL_TIMEOUT:5s} # 連線超時 
      readTimeout: ${DB_MYSQL_READ_TIMEOUT:10s} # 讀取超時 
      writeTimeout: ${DB_MYSQL_WRITE_TIMEOUT:10s} # 寫入超時
    mongodb:
      active: ${DB_MONGODB_ACTIVE:true}
      hosts: 
        - ${DB_MONGODB_HOSTS:mongo:27017}
      replicaSet: ${DB_MONGODB_REPLICA_SET:rs0}
      maxPoolSize: ${DB_MONGODB_MAX_POOL_SIZE:}
      minPoolSize: ${DB_MONGODB_MIN_POOL_SIZE:}
      connectTimeoutMS: ${DB_MONGODB_CONNECT_TIMEOUT_MS:}
      serverSelectionTimeoutMS: ${DB_MONGODB_SERVER_SELECTION_TIMEOUT_MS:}
      heartbeatIntervalMS: ${DB_MONGODB_HEARTBEAT_INTERVAL_MS:}
      readPreference: ${DB_MONGODB_READ_PREFERENCE:}
      retryWrites: ${DB_MONGODB_RETRY_WRITES:}
      retryReads: ${DB_MONGODB_RETRY_READS:}
      writeConcern: ${DB_MONGODB_WRITE_CONCERN:}
      username: ${DB_MONGODB_USERNAME:root}
      password: ${DB_MONGODB_PASSWORD:root}
      dbname: ${DB_MONGODB_DBNAME:demo}
      log:
        enabled: ${DB_MONGODB_LOG_ENABLED:}
        debug: ${DB_MONGODB_LOG_DEBUG:}

servers:
  cmder:
    enableReadEvalPrintLoop: ${CMDER_ENABLE_READ_EVAL_PRINT_LOOP}
  

log:
  level: ${LOG_LEVEL:info}