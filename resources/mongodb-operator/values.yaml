operator:

  # dev / prod
  env: dev

  # Operator replica
  replicas: 1

  # "*" = all namespace
  # watchNamespace: "*"

  # 同時處理多少 reconciliation
  maxConcurrentReconciles: 5

  resources:
    requests:
      cpu: 100m
      memory: 200Mi

    limits:
      cpu: 250m
      memory: 512Mi

registry:
  pullPolicy: IfNotPresent