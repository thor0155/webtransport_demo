version: "3"

vars:
  APP_ENV: '{{.APP_ENV | default "production"}}'

tasks:
  run:backend:migrate:
    desc: Start backend migrator container
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - docker compose run --rm backend_migrate migrate gorm
      - docker compose run --rm backend_migrate migrate mongodb

  up:
    desc: Start full stack with docker-compose
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      # - docker compose up --build
      - docker compose up -d

  down:
    desc: Stop docker-compose
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - docker compose down
  
  ps:
    desc: Show running containers
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - docker compose ps

  logs:
    desc: Show docker logs
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - docker compose logs -f

  build:
    desc: Build docker images
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - task: build:backend
      - task: build:frontend
  
  build:backend:
    desc: Build backend docker image
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - task: build:backend:server
      - task: build:backend:migrate

  build:backend:migrate:
    desc: Build backend migrator docker image
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - docker compose build backend_migrate
      - task: tag
        vars:
          package: 'demo-backend-migrate'
    env:
      BACKEND_MIGRATE_ENV_NAME: '{{.APP_ENV}}'
      BACKEND_MIGRATE_BUILD_VERSION: '{{.BUILD_VERSION}}'
      BACKEND_MIGRATE_BUILD_DATE: '{{.BUILD_DATE}}'
      BACKEND_MIGRATE_BUILD_COMMIT: '{{.BUILD_COMMIT}}'
      BACKEND_MIGRATE_BUILD_BRANCH: '{{.BUILD_BRANCH}}'
      
  build:backend:server:
    desc: Build backend server docker image
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - docker compose build backend_server
      - task: tag
        vars:
          package: 'demo-backend-server'
    env:
      BACKEND_SERVER_ENV_NAME: '{{.APP_ENV}}'
      BACKEND_SERVER_BUILD_VERSION: '{{.BUILD_VERSION}}'
      BACKEND_SERVER_BUILD_DATE: '{{.BUILD_DATE}}'
      BACKEND_SERVER_BUILD_COMMIT: '{{.BUILD_COMMIT}}'
      BACKEND_SERVER_BUILD_BRANCH: '{{.BUILD_BRANCH}}'

  build:frontend:
    desc: Build frontend docker image
    dir: "{{.DOCKER_COMPOSE_DIR}}"
    cmds:
      - docker compose build frontend
      - task: tag
        vars:
          package: 'demo-frontend'

  digest:
    desc: Show docker image digest
    cmds:
      - docker inspect --format='{{"{{"}}index .RepoDigests 0{{"}}"}}' {{.package}}:{{.version}} | cut -d@ -f2
  
  tag:
    desc: Tag docker image
    vars:
      source_tag: '{{.source_tag | default "latest"}}'
      dest_tag: '{{.dest_tag | default "latest"}}'
      source: '{{.package}}:{{.source_tag}}'
      dest: '{{.repository}}/{{.package}}:{{.dest_tag}}'
    cmds:
      - docker tag {{.source}} {{.dest}}
  
  _push:
    internal: true
    desc: Push docker image to registry
    cmds:
      - docker push {{.repository}}/{{.package}}:{{.version}}
  push:
    desc: Push docker images to registry
    cmds:
      - task: push:backend
      - task: push:frontend
  push:backend:
    desc: Push backend docker images to registry
    cmds:
      - task: _push
        vars:
          package: 'demo-backend-server'
      - task: _push
        vars:
          package: 'demo-backend-migrate'
  push:frontend:
    desc: Push frontend docker image to registry
    cmds:
      - task: _push
        vars:
          package: 'demo-frontend'