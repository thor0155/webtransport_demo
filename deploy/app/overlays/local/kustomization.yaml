namespace: local

generatorOptions:
  disableNameSuffixHash: true
  
resources:
  - ../../base
  - ../../../../mysql

patches:
  - path: patch-backend-image.yaml
    target:
      kind: Deployment
      name: backend
      
  - path: patch-frontend-image.yaml
    target:
      kind: Deployment
      name: frontend

# secretGenerator:
#   - name: tls-cert-secret
#     type: kubernetes.io/tls
#     files:
#       - tls.crt=localhost+4.pem
#       - tls.key=localhost+4-key.pem

configMapGenerator:
  - name: backend-config
    literals:
      - WEBTRANSPORT_USE_SELF_CERT=false

