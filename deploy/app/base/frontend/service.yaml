apiVersion: v1
kind: Service

metadata:
  name: frontend

  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: chat-demo

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: frontend

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http