apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: demo-app:latest
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MYSQL_DSN
              value: "root:password@tcp(mysql:3306)/demo?charset=utf8mb4&parseTime=True&loc=Local"
          ports:
            - containerPort: 8080
          readinessProbe: #主要重點設定
            httpGet:
              path: /healthz       # 健康檢查路徑
              port: 8080           # 健康檢查端口
            initialDelaySeconds: 5 # 啟動後延遲 5 秒再檢查
            periodSeconds: 10      # 每 10 秒檢查一次
            timeoutSeconds: 2      # 每次檢查最多等待 2 秒
            failureThreshold: 3    # 連續失敗 3 次 → Pod 標記為 Not Ready
