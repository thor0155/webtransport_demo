apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-cert-keygen
spec:
  secretName: tls-cert-secret
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  dnsNames:
    - "wt.example.com"
    - "api.example.com"
    - "app.example.com"

  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

  renewBeforePercentage: 10