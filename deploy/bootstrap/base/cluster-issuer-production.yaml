apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: thor0155@gmail.com
    privateKeySecretRef:
      name: letsencrypt-dns-thorlinlab
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - "thorlinlab.cc"